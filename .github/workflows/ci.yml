name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: true
      - name: format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - name: web
        if: runner.os == 'Linux'
        run: |
          GOOS=js GOARCH=wasm go vet ./cmd/blanc-web
          sh scripts/build-web.sh dist/web
          node scripts/web-smoke.mjs dist/web testdata
      - name: dist
        if: runner.os == 'Linux'
        run: sh scripts/dist.sh v0.0.0-ci

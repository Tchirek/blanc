version: 1

# 見えぬ目を
# アプリの窓に
# 灯すなり
sensitive:
  data_types:
    - location
    - contacts
    - sms
    - identity
  categories:
    - telemetry
    - ads
    - location

include_system: true

# 名を呼べば
# 白き窓辺に
# 鍵をかけ
apps:
  jp.quietreader.app:
    mode: allow
  com.nightmarket.shop:
    allow:
      - metrics.quietreader.jp
    block:
      - api.nightmarket.cn

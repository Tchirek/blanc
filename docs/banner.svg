<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">BLANC</title>
  <desc id="desc">BLANC wordmark, red underline, vertical divider, and a three-line Japanese haiku.</desc>
  <rect width="1200" height="300" fill="#050505"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="206" y="178" fill="#f2f2f2" font-size="120" font-weight="700" textLength="432" lengthAdjust="spacing">BLANC</text>
    <rect x="210" y="204" width="424" height="3" fill="#ff3b30"/>
    <rect x="726" y="70" width="1" height="160" fill="#242424"/>
    <text x="815" y="106" fill="#e8e8e8" font-size="26" letter-spacing="7">白き紙</text>
    <text x="815" y="156" fill="#e8e8e8" font-size="26" letter-spacing="7">通信の闇を</text>
    <text x="815" y="206" fill="#e8e8e8" font-size="26" letter-spacing="7">断ち切ろう</text>
  </g>
</svg>

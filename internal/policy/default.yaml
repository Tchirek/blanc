version: 1

# 白き紙
# 越えてはならぬ
# 線を引く
compile:
  globalize: none
  include_system: true

# 砂の名を
# 人の言葉に
# 置き換える
sensitive:
  require: true
  data_types:
    - location
    - contacts
    - sms
    - calls
    - mic
    - camera
    - screen
    - apps
    - identity
    - files
    - calendar
    - accounts
  categories:
    - telemetry
    - ads
    - location
    - security
    - system
  min_score: 0

# 影を消す
# アプリの窓に
# 鍵をかけ
apps: {}

# 門を閉じ
# 内なる声を
# 守る朝
domains: {}

# 夜の網
# 眠る端末に
# 静けさを
quarantine:
  min_blocked_domains: 1
  include_system: false
  include_shared_uid: false
  background_restrict: true
  appops_background: false
  force_stop: true
